<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Cyan to Purple Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base (App Icon Rounded Style) -->
  <rect width="512" height="512" fill="url(#bg)" rx="112" />

  <!-- Ambient Glowing Accents -->
  <circle cx="120" cy="120" r="90" fill="#38bdf8" opacity="0.22" filter="url(#glow)" />
  <circle cx="390" cy="390" r="110" fill="#c084fc" opacity="0.22" filter="url(#glow)" />

  <!-- Abstract Tech Grid Dots -->
  <g opacity="0.25">
    <circle cx="70" cy="70" r="3" fill="#ffffff" />
    <circle cx="100" cy="70" r="3" fill="#ffffff" />
    <circle cx="70" cy="100" r="3" fill="#ffffff" />
    <circle cx="100" cy="100" r="3" fill="#ffffff" />

    <circle cx="410" cy="410" r="3" fill="#ffffff" />
    <circle cx="440" cy="410" r="3" fill="#ffffff" />
    <circle cx="410" cy="440" r="3" fill="#ffffff" />
    <circle cx="440" cy="440" r="3" fill="#ffffff" />
  </g>

  <!-- Centered Bold "RM" Only -->
  <text 
    x="50%" 
    y="52%" 
    font-family="'Inter', system-ui, -apple-system, sans-serif" 
    font-size="230" 
    font-weight="900" 
    fill="url(#textGrad)" 
    text-anchor="middle" 
    dominant-baseline="central" 
    letter-spacing="4" 
    filter="url(#dropShadow)"
  >
    RM
  </text>
</svg>
